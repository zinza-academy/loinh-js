services:
  client:
    image: bossvirus03/zinza-vaccine-frontend:latest
    env_file:
      - path: .env
        required: true
    ports:
      - "3000:3000"
  server:
    image: bossvirus03/zinza-vaccine-backend:latest
    depends_on:
      - db
    env_file:
      - path: .env
        required: true
    ports:
      - "8080:8080"
  db:
    image: postgres:15
    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
volumes:
  minio-data:
  postgres-data:
