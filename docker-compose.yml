services:
  client:
    build:
      context: ./frontend
      dockerfile: docker/prod.Dockerfile
    image: bossvirus03/zinza-vaccine-frontend:latest
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"

  server:
    build:
      context: ./backend
      dockerfile: docker/prod.Dockerfile
    image: bossvirus03/zinza-vaccine-backend:latest
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/prisma:/app/prisma
    depends_on:
      - db
    ports:
      - "8080:8080"

  db:
    image: postgres:15
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3001:3000'
    env_file:
      - ./backend/.env
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
volumes:
  minio-data:
  postgres-data:
