services:
  client:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    restart: always
    ports:
      - "3000:3000"
  server:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend/src:/app/src
      - ./backend/lib:/app/lib
      - ./backend/prisma:/app/prisma
      - ./backend/config:/app/config
      - /app/node_modules
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
  db:
    image: postgres:15
    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
volumes:
  minio-data:
  postgres-data:
